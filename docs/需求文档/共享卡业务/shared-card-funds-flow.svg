<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1800 1210" style="display:block;max-width:1800px;height:auto" role="img" aria-labelledby="title desc">
  <title id="title">企业共享卡资金流转流程</title>
  <desc id="desc">展示企业入金进入唯一专项资金池、渠道额度同步、共享卡授权和结算、提现以及拒付争议的资金流转。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#536278" />
    </marker>
    <style>
      .title { font: 700 30px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #162033; }
      .lane-title { font: 700 21px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #162033; text-anchor: middle; }
      .label { font: 600 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1d2a3d; text-anchor: middle; }
      .small { font: 500 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #536278; text-anchor: middle; }
      .edge { fill: none; stroke: #536278; stroke-width: 3; marker-end: url(#arrow); }
      .edge-label { font: 600 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #39475c; }
      .process { fill: #eef4ff; stroke: #2f6bff; stroke-width: 2.5; rx: 14; }
      .money { fill: #ecf9f1; stroke: #219653; stroke-width: 2.5; rx: 14; }
      .decision { fill: #fff7e8; stroke: #e59a16; stroke-width: 2.5; }
      .risk { fill: #fff1f0; stroke: #dc4c4c; stroke-width: 2.5; rx: 14; }
      .hold { fill: #fff9df; stroke: #d8a800; stroke-width: 2.5; rx: 14; }
      .lane { fill: none; stroke: #d9e0ea; stroke-width: 2; stroke-dasharray: 8 7; rx: 18; }
    </style>
  </defs>

  <rect width="1800" height="1210" fill="#ffffff" />
  <text class="title" x="900" y="46" text-anchor="middle">企业共享卡资金流转流程</text>

  <rect class="money" x="130" y="76" width="330" height="68" />
  <text class="label" x="295" y="107">企业钱包向资金池入金</text>
  <text class="small" x="295" y="132">Enterprise funding</text>
  <path class="edge" d="M460 110 L565 110" />

  <rect class="process" x="565" y="76" width="330" height="68" />
  <text class="label" x="730" y="107">专项资金池统一记账</text>
  <text class="small" x="730" y="132">Single source of funds</text>
  <path class="edge" d="M895 110 L1000 110" />

  <rect class="money" x="1000" y="76" width="330" height="68" />
  <text class="label" x="1165" y="107">同步全部渠道额度</text>
  <text class="small" x="1165" y="132">max(0, dedicated pool available)</text>
  <path class="edge" d="M1330 110 L1435 110" />

  <rect class="process" x="1435" y="68" width="300" height="84" />
  <text class="label" x="1585" y="100">开共享卡并设额度</text>
  <text class="small" x="1585" y="126">不划拨、不冻结账户余额</text>

  <path class="edge" d="M1585 152 C1585 190 1160 190 1030 238" />
  <polygon class="decision" points="900,218 1035,268 900,318 765,268" />
  <text class="label" x="900" y="263">后续资金事件</text>
  <text class="small" x="900" y="287">Funding event</text>

  <rect class="lane" x="45" y="350" width="540" height="800" />
  <rect class="lane" x="630" y="350" width="540" height="800" />
  <rect class="lane" x="1215" y="350" width="540" height="800" />
  <text class="lane-title" x="315" y="385">共享卡交易</text>
  <text class="lane-title" x="900" y="385">企业提现</text>
  <text class="lane-title" x="1485" y="385">拒付与争议</text>

  <path class="edge" d="M765 268 C560 285 360 305 315 418" />
  <text class="edge-label" x="500" y="310">交易</text>
  <rect class="process" x="105" y="418" width="420" height="90" />
  <text class="label" x="315" y="450">卡片所属供应商处理授权</text>
  <text class="small" x="315" y="478">实时决策可用时校验专项资金池余额，否则事后同步</text>
  <path class="edge" d="M315 508 L315 548" />
  <polygon class="decision" points="315,548 445,598 315,648 185,598" />
  <text class="label" x="315" y="594">授权是否批准</text>
  <text class="small" x="315" y="618">Authorized?</text>
  <path class="edge" d="M185 598 L88 598" />
  <text class="edge-label" x="125" y="582">否</text>
  <rect class="risk" x="70" y="670" width="220" height="76" />
  <text class="label" x="180" y="701">拒绝交易</text>
  <text class="small" x="180" y="728">不伪造扣款</text>
  <path class="edge" d="M315 648 L315 670" />
  <text class="edge-label" x="335" y="663">是</text>
  <rect class="hold" x="305" y="670" width="250" height="76" />
  <text class="label" x="430" y="701">形成授权占用</text>
  <text class="small" x="430" y="728">减少专项资金池可用余额</text>
  <path class="edge" d="M430 746 L430 792" />
  <polygon class="decision" points="430,792 540,838 430,884 320,838" />
  <text class="label" x="430" y="835">交易后续结果</text>
  <path class="edge" d="M320 838 L215 838" />
  <rect class="money" x="72" y="800" width="235" height="76" />
  <text class="label" x="190" y="831">撤销或过期</text>
  <text class="small" x="190" y="858">释放授权占用</text>
  <path class="edge" d="M430 884 L430 930" />
  <rect class="money" x="235" y="930" width="320" height="94" />
  <text class="label" x="395" y="964">部分或最终结算</text>
  <text class="small" x="395" y="991">按最终金额记账并释放多余占用</text>
  <path class="edge" d="M395 1024 L395 1060" />
  <rect class="process" x="125" y="1060" width="380" height="70" />
  <text class="label" x="315" y="1090">更新交易、卡额度和资金池账本</text>
  <text class="small" x="315" y="1117">余额 ≤ 0：渠道额度归零并停用池下全部卡</text>

  <path class="edge" d="M900 318 L900 418" />
  <text class="edge-label" x="920" y="343">提现</text>
  <rect class="process" x="690" y="418" width="420" height="76" />
  <text class="label" x="900" y="450">查询专项资金池最新账本</text>
  <text class="small" x="900" y="477">并核对各供应商未决交易</text>
  <path class="edge" d="M900 494 L900 535" />
  <rect class="hold" x="690" y="535" width="420" height="92" />
  <text class="label" x="900" y="568">计算可提现余额</text>
  <text class="small" x="900" y="595">扣除待提现、待结算、拒付准备金和费用</text>
  <path class="edge" d="M900 627 L900 670" />
  <polygon class="decision" points="900,670 1030,720 900,770 770,720" />
  <text class="label" x="900" y="715">提现金额是否可用</text>
  <text class="small" x="900" y="739">Withdrawable?</text>
  <path class="edge" d="M770 720 L678 720" />
  <text class="edge-label" x="710" y="704">否</text>
  <rect class="risk" x="655" y="792" width="235" height="76" />
  <text class="label" x="773" y="823">拒绝提现</text>
  <text class="small" x="773" y="850">显示可提现余额</text>
  <path class="edge" d="M900 770 L900 792" />
  <text class="edge-label" x="920" y="785">是</text>
  <rect class="hold" x="905" y="792" width="235" height="76" />
  <text class="label" x="1023" y="823">先占用提现金额</text>
  <text class="small" x="1023" y="850">再向上游提交</text>
  <path class="edge" d="M1023 868 L1023 918" />
  <polygon class="decision" points="1023,918 1130,962 1023,1006 916,962" />
  <text class="label" x="1023" y="958">提现最终结果</text>
  <path class="edge" d="M916 962 L820 962" />
  <rect class="money" x="655" y="925" width="245" height="74" />
  <text class="label" x="778" y="956">提现失败</text>
  <text class="small" x="778" y="983">释放提现占用</text>
  <path class="edge" d="M1023 1006 L1023 1055" />
  <rect class="money" x="835" y="1055" width="330" height="76" />
  <text class="label" x="1000" y="1086">提现成功</text>
  <text class="small" x="1000" y="1113">正式扣减企业账户余额</text>

  <path class="edge" d="M1035 268 C1240 285 1440 305 1485 418" />
  <text class="edge-label" x="1300" y="310">拒付</text>
  <rect class="risk" x="1275" y="418" width="420" height="76" />
  <text class="label" x="1485" y="450">上游返回争议事件</text>
  <text class="small" x="1485" y="477">Chargeback / Dispute</text>
  <path class="edge" d="M1485 494 L1485 545" />
  <rect class="hold" x="1275" y="545" width="420" height="92" />
  <text class="label" x="1485" y="578">冻结争议金额和相关费用</text>
  <text class="small" x="1485" y="605">减少可提现余额</text>
  <path class="edge" d="M1485 637 L1485 690" />
  <polygon class="decision" points="1485,690 1615,740 1485,790 1355,740" />
  <text class="label" x="1485" y="736">争议最终结果</text>
  <text class="small" x="1485" y="760">Dispute result</text>
  <path class="edge" d="M1355 740 L1260 740" />
  <text class="edge-label" x="1288" y="724">胜诉</text>
  <rect class="money" x="1240" y="820" width="245" height="78" />
  <text class="label" x="1363" y="852">释放争议准备金</text>
  <text class="small" x="1363" y="880">恢复可提现余额</text>
  <path class="edge" d="M1485 790 L1485 820" />
  <text class="edge-label" x="1505" y="809">败诉</text>
  <rect class="risk" x="1500" y="820" width="230" height="78" />
  <text class="label" x="1615" y="852">记入拒付损失</text>
  <text class="small" x="1615" y="880">扣减企业账户余额</text>
  <path class="edge" d="M1615 898 L1615 958" />
  <polygon class="decision" points="1615,958 1720,1000 1615,1042 1510,1000" />
  <text class="label" x="1615" y="996">余额是否充足</text>
  <path class="edge" d="M1510 1000 L1400 1000" />
  <rect class="money" x="1240" y="963" width="245" height="74" />
  <text class="label" x="1363" y="994">完成损失记账</text>
  <text class="small" x="1363" y="1021">更新审计和风险数据</text>
  <path class="edge" d="M1615 1042 L1615 1080" />
  <rect class="risk" x="1415" y="1080" width="340" height="66" />
  <text class="label" x="1585" y="1108">进入负余额处理</text>
  <text class="small" x="1585" y="1133">禁止提现、限制卡片并通知补足资金</text>
</svg>
