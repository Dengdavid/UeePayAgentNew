<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1600 1280" style="display:block;max-width:1600px;height:auto" role="img" aria-labelledby="title desc">
  <title id="title">企业共享卡开卡流程</title>
  <desc id="desc">从企业资格校验、选择专项资金池和卡产品、选择用卡人、配置额度，到创建或复用渠道额度账户并处理开卡结果的完整流程。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#536278" />
    </marker>
    <style>
      .title { font: 700 30px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #162033; }
      .label { font: 600 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1d2a3d; text-anchor: middle; }
      .small { font: 500 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #536278; text-anchor: middle; }
      .edge { fill: none; stroke: #536278; stroke-width: 3; marker-end: url(#arrow); }
      .edge-label { font: 600 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #39475c; }
      .process { fill: #eef4ff; stroke: #2f6bff; stroke-width: 2.5; rx: 14; }
      .decision { fill: #fff7e8; stroke: #e59a16; stroke-width: 2.5; }
      .deny { fill: #fff1f0; stroke: #dc4c4c; stroke-width: 2.5; rx: 14; }
      .success { fill: #ecf9f1; stroke: #219653; stroke-width: 2.5; rx: 14; }
      .pending { fill: #fff9df; stroke: #d8a800; stroke-width: 2.5; rx: 14; }
      .failed { fill: #fff1f0; stroke: #dc4c4c; stroke-width: 2.5; rx: 14; }
    </style>
  </defs>

  <rect width="1600" height="1280" fill="#ffffff" />
  <text class="title" x="800" y="48" text-anchor="middle">企业共享卡开卡流程</text>

  <rect class="process" x="620" y="75" width="360" height="60" />
  <text class="label" x="800" y="112">用户访问共享卡</text>

  <path class="edge" d="M800 135 L800 170" />
  <polygon class="decision" points="800,170 960,230 800,290 640,230" />
  <text class="label" x="800" y="224">是否为企业账户</text>
  <text class="small" x="800" y="248">Enterprise account?</text>

  <path class="edge" d="M640 230 L475 230" />
  <text class="edge-label" x="535" y="214">否</text>
  <rect class="deny" x="75" y="188" width="400" height="84" />
  <text class="label" x="275" y="222">显示企业专属引导</text>
  <text class="small" x="275" y="250">节点可见，业务接口由服务端拒绝</text>

  <path class="edge" d="M800 290 L800 325" />
  <text class="edge-label" x="820" y="314">是</text>
  <polygon class="decision" points="800,325 1025,400 800,475 575,400" />
  <text class="label" x="800" y="378">企业是否满足准入要求</text>
  <text class="small" x="800" y="405">认证、权限、产品开通、地区和风控</text>
  <text class="small" x="800" y="430">Eligibility verified by server</text>

  <path class="edge" d="M575 400 L475 400" />
  <text class="edge-label" x="515" y="384">否</text>
  <rect class="deny" x="75" y="358" width="400" height="84" />
  <text class="label" x="275" y="392">显示不可用原因</text>
  <text class="small" x="275" y="420">或进入正式企业认证引导</text>

  <path class="edge" d="M800 475 L800 510" />
  <text class="edge-label" x="820" y="500">是</text>
  <rect class="process" x="565" y="510" width="470" height="62" />
  <text class="label" x="800" y="548">企业管理员创建共享卡</text>

  <path class="edge" d="M800 572 L800 600" />
  <rect class="process" x="565" y="600" width="470" height="62" />
  <text class="label" x="800" y="638">选择 USD 专项资金池和虚拟卡产品</text>

  <path class="edge" d="M800 662 L800 690" />
  <rect class="process" x="565" y="690" width="470" height="76" />
  <text class="label" x="800" y="722">选择企业用卡人</text>
  <text class="small" x="800" y="750">填写项目、用途和卡昵称</text>

  <path class="edge" d="M800 766 L800 794" />
  <rect class="process" x="565" y="794" width="470" height="76" />
  <text class="label" x="800" y="826">配置可交易额度</text>
  <text class="small" x="800" y="854">累计、单笔、每日和每月限额</text>

  <path class="edge" d="M800 870 L800 898" />
  <rect class="process" x="565" y="898" width="470" height="76" />
  <text class="label" x="800" y="930">确认资金规则</text>
  <text class="small" x="800" y="958">真实资金仅在所选专项资金池，渠道额度不等于新增资金</text>

  <path class="edge" d="M800 974 L800 1002" />
  <rect class="process" x="565" y="1002" width="470" height="76" />
  <text class="label" x="800" y="1034">服务端再次校验企业资格</text>
  <text class="small" x="800" y="1062">确保渠道额度账户已同步，生成 operationId 后提交开卡</text>

  <path class="edge" d="M800 1078 L800 1102" />
  <polygon class="decision" points="800,1102 960,1158 800,1214 640,1158" />
  <text class="label" x="800" y="1152">开卡最终结果</text>
  <text class="small" x="800" y="1177">Opening result</text>

  <path class="edge" d="M640 1158 L485 1158" />
  <text class="edge-label" x="535" y="1142">失败</text>
  <rect class="failed" x="90" y="1120" width="395" height="76" />
  <text class="label" x="288" y="1152">显示安全失败原因</text>
  <text class="small" x="288" y="1180">不伪造成功，不自动重试</text>

  <path class="edge" d="M960 1158 L1115 1158" />
  <text class="edge-label" x="1015" y="1142">成功</text>
  <rect class="success" x="1115" y="1120" width="395" height="76" />
  <text class="label" x="1312" y="1152">保存员工团队账号与卡片关联</text>
  <text class="small" x="1312" y="1180">显示成功并进入卡片详情</text>

  <path class="edge" d="M800 1214 L800 1230" />
  <rect class="pending" x="565" y="1230" width="470" height="46" />
  <text class="small" x="800" y="1259">结果未知：禁止重复开卡，使用原 operationId 补查或等待 Webhook</text>
</svg>
